  <path fill="url(#surface)" d="M-30 706 Q700 315 1470 725 V930 H-30Z"/>
  <path fill="url(#reflection)" filter="url(#soft-reflection)" d="M-35 829 C355 635 870 555 1480 847 V930 H-35Z"/>
  <use href="#horizon" fill="none" stroke="url(#rim)" stroke-width="13" opacity=".73" filter="url(#halo)"/>
  <use href="#horizon" fill="none" stroke="url(#rim)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  <path fill="url(#reflection)" opacity=".6" d="M-20 254 C160 204 278 106 385 -24 H281 C186 102 75 184 -20 254Z"/>
  <path fill="url(#reflection)" opacity=".48" d="M1035 468 C1240 428 1272 254 1460 176 V249 C1278 275 1232 432 1035 468Z"/>
  <g fill="none" stroke="url(#edge)">
    <use href="#upper" stroke-width="8" opacity=".68" filter="url(#halo)"/>
    <use href="#right" stroke="url(#right-edge)" stroke-width="8" opacity=".68" filter="url(#halo)"/>
    <use href="#upper" stroke-width="1"/>
    <use href="#right" stroke="url(#right-edge)" stroke-width="1"/>
  </g>
