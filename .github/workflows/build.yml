name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bun_path: /Users/runner/.bun/bin/bun
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bun_path: C:\Users\runner\.bun\bin\bun.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Install frontend dependencies
        run: npm ci

      - name: Build nova binary (latest npm)
        shell: bash
        run: npm run build:nova
        env:
          BUN_CMD: ${{ matrix.bun_path }}

      - name: Get bundled Nova version
        id: nova
        shell: bash
        run: |
          VER=$(npm view @dongzijie1/nova version 2>/dev/null || echo "unknown")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nova Studio ${{ github.ref_name }}"
          releaseBody: |
            ## Nova Studio ${{ github.ref_name }}

            ### 安装说明
            - **macOS**: 下载 `.dmg` 文件，拖入 Applications 即可
            - **Windows**: 下载 `.exe` 安装包，双击运行

            ### 内置版本
            - Nova Agent v${{ steps.nova.outputs.version }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
